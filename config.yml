            time: 2017.09 - 2021.06
            title: 物理学（师范/理学）· 理学学士

          - type: work
            place: 新凯旋教育学校
            time: 2020.05 - 2024.08
            title: 高中物理兼职教师
            content: 承担高中物理兼职授课与个性化辅导，注重物理模型与解题方法引导，所带学生物理成绩有很大提高。

          - type: work
            place: 北京学而思网络科技有限公司
            time: 2018.11 - 2019.06
            title: 高中物理实习教师
            content: 参与高中物理教研、讲义编撰与课堂互动教学设计，系统梳理高考高频考点与学生易错题型。

          - type: volunteer
            place: 河南省开封市兰考县（北京益微青年公益发展中心）
            time: 2019 暑期
            title: 基层支教志愿者
            content: 深入基层乡村学校开展暑期支教，主讲“趣味物理科普与动手小实验”系列课程，践行师范生从教初心。

          - type: project
            place: 中央高校基本科研业务专项资金
            time: 2021
            title: 重点培育项目负责人
            content: 主持重点课题《紫外 B 波段余辉发光的谱学及应用研究》，全面统筹方案设计、课题分工并圆满通过结项验收。

