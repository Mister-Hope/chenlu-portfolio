    title: Chen Lu | Portfolio
    description: The personal portfolio of Chen Lu, a high school physics teacher and Ph.D. candidate in condensed matter physics.

    hero:
      name: Chen Lu
      welcome: 👋 Hi there, I am
      titles:
        - High School Physics Teacher
        - Condensed Matter Physics Ph.D. Candidate
        - Six-Year Student Leader
      avatar: /avatar.avif
      bgImage: /bg.avif
      medias:
        - icon: envelope
          name: Email
          link: mailto:chenl987@nenu.edu.cn

        - icon: fa7-brands:orcid
          name: ORCID
          link: https://orcid.org/0009-0006-5397-4679

        - icon: address-card
          name: Resume
          link: https://chenlu-resume.innenu.com

    navbar:
      links:
        - label: Profile
          anchor: "#profile"
        - label: Experience
          anchor: "#experience"
        - label: Publications
          anchor: "#publications"
        - label: Awards
          anchor: "#awards"
        - label: Student Work
          anchor: "#student-work"
        - label: Evaluation
          anchor: "#evaluation"

    sections:
      - type: profile
        id: profile
        title: Profile
        icon: user-tie
        data:
          fields:
            - title: Name
              icon: user
              value: Chen Lu

            - title: Political Status
              icon: flag
              value: Member of the Communist Party of China

            - title: Certificates
              icon: certificate
              value:
                - Senior High School Physics Teaching Certificate
                - Mandarin Proficiency Level 2A
                - College English Test Band 6 (CET-6)

          contacts:
            - label: Email
              value: chenl987@nenu.edu.cn
              icon: envelope

            - label: WeChat
              value: Mistress-Hope
              icon: fa7-brands:weixin

          slogan: Serving the nation through education — dedicated to high school physics teaching.

      - type: banner
        id: aspiration
        title: Career Aspiration
        icon: bullhorn
        data:
          header: |-
            Committed to High School Physics Teaching
          tags: Open to Opportunities
          content: |-
            Solid research training in condensed matter physics and four years of high school physics teaching practice enable me to inspire students with rigorous scientific thinking and lively physics classes.
          footer: |-
            Feel free to reach out: [chenl987@nenu.edu.cn](mailto:chenl987@nenu.edu.cn)
          actions:
            - label: Contact Me
              link: mailto:chenl987@nenu.edu.cn
              primary: true

      - type: experience
        id: experience
        title: Education & Experience
        icon: graduation-cap
        data:
          - type: study
            place: Northeast Normal University, School of Physics
            time: Sep. 2021 - Jun. 2027 (Expected)
            title: Successive Master–Doctoral Program · Condensed Matter Physics
            content: Admitted through the recommendation-without-examination track.

          - type: study
            place: Northeast Normal University, School of Physics
            time: Sep. 2017 - Jun. 2021
            title: Bachelor of Science in Physics (Teacher Education)

          - type: work
            place: New Kaixuan Education School
            time: May 2020 - Aug. 2024
            title: Part-time High School Physics Teacher
            content: Delivered part-time high school physics lessons and one-on-one tutoring, emphasizing physical models and problem-solving methods; students' physics performance improved considerably.

          - type: work
            place: Beijing Xueersi Online School (TAL Education Group)
            time: Nov. 2018 - Jun. 2019
            title: High School Physics Teaching Intern
            content: Participated in teaching research, lecture-note editing and interactive classroom design, and systematically organized high-frequency exam points and common mistakes.

          - type: volunteer
            place: Lankao County, Kaifeng, Henan (Beijing Yiyi Youth Public Welfare Center)
            time: Summer 2019
            title: Rural Education Volunteer
            content: Taught a "Fun Physics & Hands-on Experiments" course series at a rural school, living out the aspiration of a teacher-education student.

          - type: project
            place: Fundamental Research Funds for the Central Universities
            time: "2021"
            title: Principal Investigator, Key Cultivation Project
            content: Led the project "Spectroscopic Study and Applications of UV-B Persistent Luminescence", coordinating the research design and division of work and passing the final review.

      - type: cards
        id: publications
        title: Selected Publications
        icon: book
        data:
          - title: "Light: Science & Applications"
            category: CAS Tier 1 TOP
            description: |-
              **First Author** · A top international journal in optics, selected as a "Leading Journal" of the Chinese STM Journals Excellence Action Plan.

          - title: Physical Review Research
            category: CAS Tier 2
            description: |-
              **First Author** · An authoritative physics journal of the American Physical Society (APS).

          - title: J. Mater. Chem. C
            category: CAS Tier 3
            description: |-
              **First Author** · A classic journal on optical functional materials published by the Royal Society of Chemistry (RSC).

          - title: APC International Photonics Conference
            category: International Conference
            description: |-
              **First Author** · Presented the research and published in a high-level international conference.

          - title: National Materials
            category: Excellence Journal
            description: |-
              **Co-First Author** · Selected for the Excellence Action Plan for High-Level Key Journals.

      - type: markdown
        id: collaboration
        title: Academic Collaboration
        icon: users
        data:
          content: In addition, I have co-authored **5 papers** in well-known international SCI journals as a major collaborator.

      - type: list
        id: awards
        title: Honors & Awards
        icon: trophy
        dot: check
        data:
          - "**Scholarships**: National Scholarship, Second-Class Scholarship, Third-Class Scholarship, Outstanding Student Leader Scholarship ×2, Innovation & Entrepreneurship Scholarship ×2."
          - "**Honors**: University Outstanding Student Leader, University May Fourth Outstanding League Member, University May Fourth Red Flag League Cadre."
          - '**Competitions & Academics**: "Internet+" Provincial Bronze Award, "Challenge Cup" Jilin Provincial Third Prize, "Light · Future" Academic Forum Outstanding Presentation Award.'

      - type: list
        id: student-work
        title: Student Work
        icon: users
        dot: diamond
        data:
          - "**2021 — 2023** School of Physics, NENU · Graduate Grade Coordinator: coordinated academic atmosphere building, ideological education and student management, with outstanding class organization skills."
          - "**2019 — 2020** Student Union, School of Physics, NENU · Secretary-General: planned large academic and cultural festivals, science lectures and league evaluation work; named a university-level outstanding cadre."
          - "**2017 — 2021** School of Physics, NENU · Undergraduate Grade Leader: served four consecutive years, with solid experience in student work and youth moral education communication."

      - type: markdown
        id: evaluation
        title: Self-Evaluation
        icon: star
        data:
          content: |-
            - Integrated bachelor–master–doctoral training in physics at Northeast Normal University; a CPC member who loves basic education, with solid physics knowledge and rigorous scientific thinking.
            - Four years of high school physics teaching and teaching-research experience; familiar with the high school physics system and key exam points; skilled at heuristic and model-based teaching.
            - Six consecutive years as undergraduate grade leader, graduate grade coordinator and student union secretary-general; strong organizational, coordination and communication skills, responsible and approachable.
            - Practical and modest, dedicated and accountable, ready to devote myself to high school physics teaching.
          card: true

    footer:
      copyright: © 2026 Chen Lu. All rights reserved.
      description: Exploring the laws of nature, inspiring young minds.

