        icon: users
        data:
          content: 另以主要合作者身份在知名国际 SCI 刊物署名发表学术论文 **5 篇**。

      - type: list
        id: awards
        title: 荣誉与奖项
        icon: trophy
        dot: check
        data:
          - "**奖学金**：国家奖学金、二等奖学金、三等奖学金、优秀学生干部奖学金 ×2、创新创业专项奖学金 ×2。"
          - "**荣誉称号**：校级优秀学生干部、校五四优秀团员、校五四红旗团干部。"
          - "**竞赛与学术**：「互联网+」省级铜奖、「挑战杯」吉林省三等奖、「光·未来」学术论坛优秀报告奖。"

      - type: list
        id: student-work
        title: 学生工作
        icon: users
        dot: diamond
        data:
          - "**2021 — 2023** 东北师范大学物理学院 · 研究生年级负责人：统筹年级日常学风建设、思政教育与学生管理事务，具备突出的班级组织协调能力。"
          - "**2019 — 2020** 东北师范大学物理学院学生会 · 学生会秘书长：负责学院大型学术文化节、科技讲座策划统筹及团学评优工作，获评校级优秀干部。"
          - "**2017 — 2021** 东北师范大学物理学院 · 本科年级长：连续 4 年担任本科年级长，具备深厚扎实的学生工作与青年德育沟通经验。"

      - type: markdown
        id: evaluation
        title: 自我评价
        icon: star
        data:
          content: |-
            - 东北师范大学物理学本硕博贯通培养，中共党员，热爱基础教育事业，具有扎实的物理学科功底与严谨的科学思维；
            - 具备四年高中物理教学实践与教研备课经验，熟悉高中物理知识体系与高考考查重点，善于启发式与模型化教学；
            - 连续六年担任本科年级长、研究生年级负责人及学生会秘书长，组织协调与沟通表达能力强，富有责任心与亲和力；
            - 作风踏实谦逊，工作敬业负责，愿以从教报国之初心，全力投入高中物理教学工作。
