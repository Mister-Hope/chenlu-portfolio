            **Thesis**: *Design of Upconversion-Excited Charging in Energy-Storage Luminescent Materials and Its Application in Optical Data Storage*

            **Research Directions**: Solid-State Optics · Luminescence Spectroscopy

            - **Upconversion nonlinear charging**: visible-light writing for fast, high-resolution optical data storage;
            - **Rare-earth trap regulation and wavelength design**: a near-infrared readout path for deep-trap information;
            - **UCL UV emission and energy transfer**: secure anti-counterfeiting and multi-level information encryption.

